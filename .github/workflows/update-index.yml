name: update-index

on:
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths: [index/**, .github/workflows/update-index.yml]

concurrency:
  group: ${{ github.ref }}-index
  cancel-in-progress: true

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # docs: https://developers.cloudflare.com/workers/wrangler/commands/pages/#pages-deploy
          command: pages deploy ./index --project-name=index-tarampamp-am --branch=main
        env: {WRANGLER_SEND_METRICS: false}
